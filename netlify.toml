[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/tiktok-studio"
  to = "/tiktok-studio.html"
  status = 200

[[redirects]]
  from = "/"
  to = "/playbook_mpr_landing.html"
  status = 200

[[redirects]]
  from = "/index.html"
  to = "/playbook_mpr_landing.html"
  status = 301

[[redirects]]
  from = "/llm-basics"
  to = "/llm-basics.html"
  status = 200

[[redirects]]
  from = "/join"
  to = "/join.html"
  status = 200

[[redirects]]
  from = "/bootcamp"
  to = "/bootcamp.html"
  status = 200

# The AI Builders demo dashboard lives on its own Netlify site; serve it here.
[[redirects]]
  from = "/studio/*"
  to = "https://kayah-automation-studio.netlify.app/:splat"
  status = 200
